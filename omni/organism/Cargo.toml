[package]
name = "organism"
version = "0.1.0"
edition = "2021"
description = "Deterministic organism core: energy, calculus, algorithms, JSON-RPC"

[lib]
name = "organism_core"
path = "src/lib.rs"

[[bin]]
name = "organism"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[workspace]
