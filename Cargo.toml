[workspace]
resolver = "2"
members = [
    "crates/sovereign-ipc",
    "crates/sovereign-crypto",
    "crates/sovereign-tunnel",
    "crates/sovereign-bridge",
    "crates/sovereign-ledger",
    "crates/sovereign-agent",
    "crates/sovereign-swarm",
    "crates/sovereign-interop",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"

[workspace.dependencies]
zeroize = { version = "1.9", default-features = false, features = ["derive", "alloc"] }
hex = "0.4"
